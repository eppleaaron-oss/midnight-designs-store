name: Private AI Factory
on:
  pull_request:
    paths: ['request-service/**', '.github/workflows/factory-check.yml']
permissions:
  contents: read
jobs:
  factory-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix request-service
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node request-service/factory-start-browser-test.mjs
