name: Reference store checks
on:
  pull_request:
    paths: ['shop.html', 'catalog.css', 'catalog-browse.js', 'scripts/qa-reference-store.mjs', '.github/workflows/reference-store.yml']
permissions:
  contents: read
jobs:
  store:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 &
          node scripts/qa-reference-store.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-reference-previews
          path: qa-reference-store-*.png
