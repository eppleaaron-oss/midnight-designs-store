name: Sync Printful catalog
on:
  workflow_dispatch:
  push:
    branches: [dark-vintage-printful]
    paths: ['.github/workflows/sync-printful.yml', 'scripts/sync-printful.mjs']
permissions:
  contents: write
concurrency:
  group: printful-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import public product data
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          PRINTFUL_STORE_ID: ${{ vars.PRINTFUL_STORE_ID }}
          PRINTFUL_PRODUCTS_ENDPOINT: ${{ vars.PRINTFUL_PRODUCTS_ENDPOINT }}
        run: node scripts/sync-printful.mjs
      - name: Save catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync Printful product catalog'
            git push
          fi

  browser-check:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Check storefront in Chromium
        run: |
          python3 -m http.server 8000 &
          node scripts/qa-store.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-previews
          path: qa-*.png
