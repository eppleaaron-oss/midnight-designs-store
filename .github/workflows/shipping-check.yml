name: Shipping information checks
on:
  push:
    branches: [shipping-information]
    paths: ['shipping*', '*html', 'page-directory.js', 'scripts/qa-shipping.mjs', 'scripts/qa-directory.mjs', '.github/workflows/shipping-check.yml']
  pull_request:
    paths: ['shipping*', 'scripts/qa-shipping.mjs']
permissions:
  contents: write
jobs:
  shipping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Check shipping and page directory
        run: |
          python3 -m http.server 8000 &
          node scripts/qa-shipping.mjs
          node scripts/qa-directory.mjs
      - name: Update actual page previews
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/layout-preview
          git diff --cached --quiet || git commit -m 'Refresh page previews with shipping information'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipping-previews
          path: qa-*.png
