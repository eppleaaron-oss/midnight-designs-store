name: Customer feedback checks
on:
  push:
    branches: [customer-feedback-page]
  pull_request:
    paths: ['feedback.*', 'contact.html', 'requests.*', 'app.js', 'request-service/**', 'scripts/qa-feedback.mjs', '.github/workflows/feedback-check.yml']
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Check feedback intake and centralized management
        run: |
          python3 -m http.server 8000 &
          node --test request-service/feedback-test.mjs request-service/test.mjs request-service/ratings-test.mjs request-service/product-reviews-test.mjs request-service/design-analytics-test.mjs
          node scripts/qa-feedback.mjs
          node request-service/feedback-browser-test.mjs
          node request-service/browser-test.mjs
          node request-service/analytics-browser-test.mjs
          node scripts/qa-design-events.mjs
          node scripts/qa-requests.mjs
          node scripts/qa-support.mjs
          node scripts/qa-owner-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-previews
          path: |
            qa-feedback-*.png
            qa-conversation-*.png
