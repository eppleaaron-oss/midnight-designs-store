name: Basic GitHub publishing connection
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/basic-github-publisher.yml', 'request-service/factory-github-publisher-client.mjs']
permissions:
  contents: write
  id-token: write
concurrency:
  group: basic-github-publisher
  cancel-in-progress: false
jobs:
  connect:
    if: github.repository == 'eppleaaron-oss/midnight-designs-store' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Connect approved store publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node request-service/factory-github-publisher-client.mjs
