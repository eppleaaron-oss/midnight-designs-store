name: Inspect new owner hoodies
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-new-hoodies.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare supplier hoodies with store
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          PRINTFUL_STORE_ID: ${{ vars.PRINTFUL_STORE_ID }}
          PRINTFUL_PRODUCTS_ENDPOINT: ${{ vars.PRINTFUL_PRODUCTS_ENDPOINT }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {printfulClient} from './scripts/printful-client.mjs';
          import {normalize} from './scripts/sync-printful.mjs';
          const get=printfulClient({token:process.env.PRINTFUL_TOKEN,storeId:process.env.PRINTFUL_STORE_ID});
          const endpoint=process.env.PRINTFUL_PRODUCTS_ENDPOINT||'store';
          const live=JSON.parse(await readFile('products.json','utf8')).products;
          const known=new Set(live.map(p=>String(p.id)));
          const candidates=[];
          for(let offset=0;;){
            const page=await get(endpoint+'/products?limit=100&offset='+offset);
            for(const p of page.result){
              if(!known.has(String(p.id))&&/hoodie/i.test(p.name)){
                const detail=(await get(endpoint+'/products/'+p.id)).result;
                const product=normalize(detail);
                candidates.push({id:String(p.id),name:p.name,ignored:p.is_ignored,externalId:detail.sync_product?.external_id,variants:product?.variants.length||0,product});
              }
            }
            offset+=page.result.length;
            if(!page.result.length||offset>=(page.paging?.total??offset))break;
          }
          candidates.sort((a,b)=>Number(b.id)-Number(a.id));
          console.log('HOODIE_AUDIT '+JSON.stringify(candidates));
          console.log('STORE_COUNT '+live.length);
          NODE
