name: Verify complete product pages
on:
  workflow_dispatch:
  push:
    branches: [product-page-details]
    paths: ['product.html', 'product-information.js', 'product-information.css', 'size-guide.js', 'scripts/product-information.mjs', 'scripts/sync-product-information.mjs', 'scripts/qa-product-information.mjs', '.github/workflows/product-information.yml']
permissions:
  contents: write
concurrency:
  group: complete-product-information
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import verified public specifications and store variant mappings
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          PRINTFUL_STORE_ID: ${{ vars.PRINTFUL_STORE_ID }}
          PRINTFUL_PRODUCTS_ENDPOINT: ${{ vars.PRINTFUL_PRODUCTS_ENDPOINT }}
        run: |
          cp products.json /tmp/catalog-before-information.json
          node scripts/sync-product-information.mjs
          node scripts/build-search-pages.mjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Verify store, studio and complete product pages
        run: |
          python3 -m http.server 8000 &
          node scripts/qa-store.mjs
          node scripts/qa-map.mjs
          node scripts/qa-master.mjs
          node scripts/qa-ai.mjs
          node scripts/qa-ai-map.mjs
          node scripts/qa-designer.mjs
          node scripts/qa-pricing.mjs
          node scripts/qa-printful-plans.mjs
          node scripts/qa-product-information.mjs
          node scripts/qa-directory.mjs
      - name: Save verified specifications and updated page photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products.json product-information.json assets/layout-preview products sitemap.xml shop.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified product specifications, store options and page previews'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-product-previews
          path: qa-*.png
