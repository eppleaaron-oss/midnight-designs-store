name: Mobile shopping checks
on:
  push:
    branches: [mobile-shopping]
    paths: ['styles.css', 'scripts/qa-mobile.mjs', '.github/workflows/mobile-check.yml']
  pull_request:
    paths: ['styles.css', 'scripts/qa-mobile.mjs']
permissions:
  contents: write
jobs:
  cart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Verify mobile shopping and existing features
        run: |
          python3 -m http.server 8000 &
          node scripts/qa-mobile.mjs
          node scripts/qa-cart.mjs
          node scripts/qa-store.mjs
          node scripts/qa-product-information.mjs
          node scripts/qa-product-photos.mjs
          node scripts/qa-directory.mjs
      - name: Refresh actual Layout previews
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/layout-preview
          git diff --cached --quiet || git commit -m 'Refresh page previews after mobile shopping improvements'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-shopping-previews
          path: qa-*.png
