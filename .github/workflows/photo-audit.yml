name: Inspect product photo task status
on:
  push:
    branches: [product-photo-audit]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read task status
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          PRINTFUL_STORE_ID: ${{ vars.PRINTFUL_STORE_ID }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const response=await fetch('https://api.printful.com/v2/products?limit=100&store_product_ids=476651184',{headers:{Authorization:'Bearer '+process.env.PRINTFUL_TOKEN,...(process.env.PRINTFUL_STORE_ID?{'X-PF-Store-Id':process.env.PRINTFUL_STORE_ID}:{})}});
          const result=await response.json();
          const raw=Array.isArray(result.data)?result.data:[];
          console.log(JSON.stringify({http:response.status,response:result,rate:response.headers.get('x-ratelimit-remaining')}));
          const tasks=raw.map(t=>({id:t.id,status:t.status,createdAt:t.created_at,failures:t.failure_reasons,variants:(t.catalog_variant_mockups||[]).map(v=>({id:v.catalog_variant_id,images:v.mockups?.length}))}));
          await fs.writeFile('photo-task-audit.json',JSON.stringify({http:response.status,tasks,error:result.error||result.errors||null},null,2));
          console.log(JSON.stringify({http:response.status,tasks}));
          JS
      - name: Save task status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photo-task-audit.json
          git commit -m 'Record product photo task status'
          git push
