name: Inspect product photo task status
on:
  push:
    branches: [product-photo-audit]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read task status
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          PRINTFUL_STORE_ID: ${{ vars.PRINTFUL_STORE_ID }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const headers={Authorization:'Bearer '+process.env.PRINTFUL_TOKEN,...(process.env.PRINTFUL_STORE_ID?{'X-PF-Store-Id':process.env.PRINTFUL_STORE_ID}:{})};
          const result={};
          for(const path of ['v2/products?limit=20','product-templates?limit=20','store/products/476651184']){
            try {const response=await fetch('https://api.printful.com/'+path,{headers,signal:AbortSignal.timeout(25000)});const body=await response.text();let data;try{data=JSON.parse(body)}catch{data={nonJson:body.slice(0,200)}};result[path]={http:response.status,data};console.log(JSON.stringify({path,http:response.status,data}));}catch(e){result[path]={error:e.message};console.log(path+': '+e.message);}
          }
          await fs.writeFile('photo-task-audit.json',JSON.stringify(result,null,2));
          JS
      - name: Save task status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photo-task-audit.json
          git commit -m 'Record product photo task status'
          git push
