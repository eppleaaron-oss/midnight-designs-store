name: Store tracking delivery checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['_config.yml', 'store-events.js', 'analytics.js', 'scripts/store-tracking-test.mjs', '.github/workflows/store-tracking-recovery.yml']
  pull_request:
    paths: ['_config.yml', 'store-events.js', 'analytics.js', 'scripts/store-tracking-test.mjs']
permissions:
  contents: read
jobs:
  tracking:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/store-tracking-test.mjs
      - name: Verify Jekyll publishes the public connection without backend files
        run: |
          mkdir -p tracking-fixture/request-service
          cp _config.yml request-service-config.json tracking-fixture/
          echo 'private backend' > tracking-fixture/request-service/private.txt
          echo 'fixture' > tracking-fixture/index.html
      - uses: actions/jekyll-build-pages@v1
        with:
          source: tracking-fixture
          destination: tracking-built
      - name: Check public and private output
        run: |
          test -f tracking-built/request-service-config.json
          test ! -e tracking-built/request-service/private.txt
          node -e "const c=JSON.parse(require('fs').readFileSync('tracking-built/request-service-config.json'));if(c.url!=='https://midnight-designs-backend.onrender.com')throw Error('Wrong store backend')"
