name: Custom studio checks
on:
  push:
    branches: [custom-design-studio, complete-design-gallery, garment-placement-map, master-dashboard, ai-printful-artwork, visual-ai-mapping, standalone-ai-designer, owner-pricing, printful-template-studio, page-layout-directory, customer-studio-cleanup]
  pull_request:
    paths: ['studio.js', '*html', '*json', 'styles.css', 'scripts/qa-studio.mjs', 'garment-map.js', 'scripts/qa-map.mjs']
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Check storefront and custom studio
        run: |
          python3 -m http.server 8000 &
          node scripts/qa-store.mjs
          node scripts/qa-map.mjs
          node scripts/qa-master.mjs
          node scripts/qa-ai.mjs
          node scripts/qa-ai-map.mjs
          node scripts/qa-designer.mjs
          node scripts/qa-pricing.mjs
          node scripts/qa-printful-plans.mjs
          node scripts/qa-directory.mjs
      - name: Save page preview photos
        if: github.event_name == 'push' && (github.ref == 'refs/heads/page-layout-directory' || github.ref == 'refs/heads/customer-studio-cleanup')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/layout-preview
          git diff --cached --quiet || git commit -m "Generate actual page preview photos"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-studio-previews
          path: qa-*.png

