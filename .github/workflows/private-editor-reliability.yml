name: Private product editor reliability
on:
  pull_request:
    paths: ['request-service/factory-reliability*', 'request-service/factory-lifecycle*', 'request-service/factory-production*', 'request-service/factory-source-download*', 'request-service/printful-*', 'request-service/public/factory-production.js', 'request-service/public/factory-basic.js', 'request-service/factory-basic-outfits.mjs', 'request-service/public/login*', 'request-service/public/product-studio*', 'request-service/factory-access*', 'request-service/public/ai-made*', 'request-service/factory-product-editor*', 'request-service/ai-made-test.mjs', 'request-service/factory-product-studio*', 'request-service/factory-measured-layouts*', 'request-service/factory-revision-history*', 'request-service/factory-recovery-audit*', 'request-service/factory-github-backup*', 'request-service/factory-basic-storage.mjs', 'request-service/public/factory-storage.js', 'request-service/factory-storage-browser-test.mjs', 'request-service/factory-basic-sizing*', 'request-service/public/factory-basic-sizing*', 'request-service/factory-sizing-test.mjs', 'request-service/factory-intelligence*', 'request-service/public/intelligence.js', 'request-service/server.mjs', '.github/workflows/private-editor-reliability.yml']
  push:
    branches: [main]
    paths: ['request-service/factory-reliability*', 'request-service/factory-lifecycle*', 'request-service/factory-production*', 'request-service/factory-source-download*', 'request-service/printful-*', 'request-service/public/factory-production.js', 'request-service/public/factory-basic.js', 'request-service/factory-basic-outfits.mjs', 'request-service/public/login*', 'request-service/public/product-studio*', 'request-service/factory-access*', 'request-service/public/ai-made*', 'request-service/factory-product-editor*', 'request-service/ai-made-test.mjs', 'request-service/factory-product-studio*', 'request-service/factory-measured-layouts*', 'request-service/factory-revision-history*', 'request-service/factory-recovery-audit*', 'request-service/factory-github-backup*', 'request-service/factory-basic-storage.mjs', 'request-service/public/factory-storage.js', 'request-service/factory-storage-browser-test.mjs', 'request-service/factory-basic-sizing*', 'request-service/public/factory-basic-sizing*', 'request-service/factory-sizing-test.mjs', 'request-service/factory-intelligence*', 'request-service/public/intelligence.js', 'request-service/server.mjs', '.github/workflows/private-editor-reliability.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix request-service
      - run: npm test --prefix request-service
      - run: node scripts/qa-sync.mjs
      - run: node --test scripts/publication-policy-test.mjs scripts/publish-studio-product-test.mjs scripts/approved-printful-media-test.mjs
      - run: node --test scripts/product-information-test.mjs scripts/studio-gallery-test.mjs scripts/size-guide-values-test.mjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Prove browser save, reload, four placements and same-product update
        run: MIDNIGHT_STUDIO_BROWSER=1 node --test --test-name-pattern='browser saves' request-service/factory-product-studio-test.mjs
      - name: Prove measured example selection, numeric inspection and saved profile
        run: MIDNIGHT_STUDIO_BROWSER=1 node --test --test-name-pattern='browser selects the approved measured' request-service/factory-sizing-test.mjs
      - name: Verify Factory recovery, counts and preset controls
        run: node request-service/factory-reliability-browser-test.mjs
      - name: Verify private storage controls and restore-check feedback
        run: node request-service/factory-storage-browser-test.mjs
      - name: Verify current storefront photos and supplier shoe-size units
        run: |
          python3 -m http.server 8123 > /tmp/store.log 2>&1 &
          node scripts/qa-verified-galleries.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-editor-browser-flow
          path: |
            qa-editor-*.png
            qa-verified-gallery-*.png
          retention-days: 3
