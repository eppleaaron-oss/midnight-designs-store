name: Owner UI checks
on:
  push:
    branches: [owner-ui-mobile]
  pull_request:
    paths: ['master.html', 'master.js', 'pricing.html', 'pricing.js', 'owner-ui.*', 'scripts/qa-owner-ui.mjs', '.github/workflows/owner-ui-check.yml']
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Test all layouts and shopping behavior
        run: |
          python3 -m http.server 8000 &
          python3 -m http.server 8001 --directory _site &
          node scripts/qa-owner-ui.mjs
          node scripts/qa-master.mjs
          node scripts/qa-pricing.mjs
          node scripts/qa-admin.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-ui-previews
          path: |
            qa-owner-*.png
            qa-master-*.png
            qa-pricing-*.png
