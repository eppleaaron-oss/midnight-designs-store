name: Customer navigation and admin isolation
on:
  push:
    branches: [admin-isolation]
  pull_request:
    paths: ['_config.yml', 'index.html', 'admin.html', '404.html', 'scripts/qa-admin.mjs', '.github/workflows/admin-check.yml', '.github/workflows/ai-design.yml', '.github/workflows/pricing.yml', '.github/workflows/manage-catalog.yml']
permissions:
  contents: read
jobs:
  public-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Verify real customer build and protected controls
        run: |
          python3 -m http.server 8001 --directory _site &
          node scripts/qa-admin.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-navigation-previews
          path: qa-*.png
