name: Good Choices bag checks
on:
  pull_request:
    paths: ['cart.html', 'bag.css', 'bag-ui.js', 'scripts/qa-good-bag.mjs', '.github/workflows/good-bag.yml']
permissions:
  contents: read
jobs:
  bag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 &
          node scripts/qa-good-bag.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: good-bag-previews
          path: qa-good-bag-*.png
