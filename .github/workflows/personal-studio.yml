name: Personal studio reference checks
on:
  pull_request:
    paths: ['custom.html', 'create-yours.css', 'garment-map.js', 'custom-review-ui.js', 'scripts/qa-personal-studio.mjs', '.github/workflows/personal-studio.yml']
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 &
          node scripts/qa-personal-studio.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-studio-previews
          path: qa-personal-*.png
