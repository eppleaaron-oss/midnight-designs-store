name: Artwork reference page checks
on:
  pull_request:
    paths: ['designs.html', 'design-gallery.css', 'design-gallery.js', 'scripts/qa-haunts-gallery.mjs', '.github/workflows/haunts-gallery.yml']
permissions:
  contents: read
jobs:
  artwork:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 &
          node scripts/qa-haunts-gallery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwork-reference-previews
          path: qa-haunts-*.png
