name: Publish store prices
on:
  workflow_dispatch:
    inputs:
      price_changes:
        description: Price changes copied from the Pricing page
        required: true
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: printful-catalog
  cancel-in-progress: false
jobs:
  pricing:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and apply prices
        env:
          PRICE_CHANGES: ${{ inputs.price_changes }}
        run: node scripts/pricing.mjs
      - name: Commit prices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products.json pricing-overrides.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish owner selling prices'
          git push
      - name: Publish storefront
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
