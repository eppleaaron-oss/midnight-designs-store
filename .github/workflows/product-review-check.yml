name: Product review checks
on:
  push:
    branches: [product-review-system]
  pull_request:
    paths: ['product-reviews.*', 'product.html', 'products/*.html', 'request-service/**', 'scripts/qa-product-reviews.mjs', '.github/workflows/product-review-check.yml']
permissions:
  contents: read
jobs:
  reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Validate review privacy and customer experience
        run: |
          python3 -m http.server 8000 &
          node --test request-service/product-reviews-test.mjs request-service/test.mjs request-service/votes-test.mjs request-service/ratings-test.mjs
          node scripts/qa-product-reviews.mjs
          node request-service/browser-test.mjs
          node scripts/qa-design-votes.mjs
          node scripts/qa-design-ratings.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-review-previews
          path: |
            qa-product-reviews-*.png
            qa-conversation-*.png
