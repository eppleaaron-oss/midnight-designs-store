name: Homepage shopping checks
on:
  pull_request:
    paths: ['index.html', 'homepage.css', 'homepage.js', 'app.js', 'scripts/qa-home.mjs', '.github/workflows/home-check.yml']
permissions:
  contents: read
jobs:
  homepage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 &
          node scripts/qa-home.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-previews
          path: qa-home-*.png
