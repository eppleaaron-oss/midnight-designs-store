name: Import Printful design plans
on:
  workflow_dispatch:
  push:
    branches: [printful-template-studio]
    paths: ['scripts/sync-printful-plans.mjs', '.github/workflows/printful-plans.yml']
permissions:
  contents: write
concurrency:
  group: printful-plans
  cancel-in-progress: false
jobs:
  plans:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Printful product and printfile requirements
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          PRINTFUL_STORE_ID: ${{ vars.PRINTFUL_STORE_ID }}
        run: node scripts/sync-printful-plans.mjs
      - name: Save verified public product plans
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add printful-plans.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified Printful print areas and layouts'
          git push
