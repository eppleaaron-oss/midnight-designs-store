name: Product identity and category checks
on:
  pull_request:
    paths: ['catalog-identity.js', 'app.js', 'catalog-browse.js', 'product-information.js', 'size-guide.js', 'scripts/*identity*', 'scripts/sync-printful.mjs', 'scripts/sync-product-information.mjs', 'request-service/factory-product-identity.mjs', '.github/workflows/catalog-identity.yml']
  push:
    branches: [main]
    paths: ['catalog-identity.js', 'app.js', 'catalog-browse.js', 'product-information.js', 'size-guide.js', 'scripts/*identity*', '.github/workflows/catalog-identity.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/catalog-identity-test.mjs
      - run: node scripts/qa-sync.mjs
      - run: npm install --no-save playwright@1.58.2 linkedom
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-collection.mjs
      - name: Verify desktop and mobile shopping controls
        run: |
          python3 -m http.server 8123 > /tmp/store.log 2>&1 &
          node scripts/qa-catalog-identity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-category-and-shoe-size-previews
          path: qa-*.png
          retention-days: 3
