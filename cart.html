<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | Midnight Designs</title><link rel="stylesheet" href="styles.css"><style>.wrap{max-width:900px;margin:auto;padding:70px 28px}.panel{border:1px solid var(--line);border-radius:20px;background:rgba(17,21,38,.88);padding:20px}.item{display:flex;justify-content:space-between;gap:18px;padding:15px 0;border-bottom:1px solid var(--line)}.row{display:flex;justify-content:space-between;margin:12px 0}</style></head><body><header><div class="nav"><a class="brand" href="index.html">MIDNIGHT DESIGNS</a><a class="pill" href="shop.html">Continue Shopping</a></div></header><main class="wrap"><h1>Your Cart</h1><div class="panel"><div id="items"></div><div class="row"><b>Total</b><b id="total">$0.00</b></div><button class="btn dark" style="width:100%">Checkout</button></div></main><script src="app.js"></script><script>function render(){const c=cart(),box=document.getElementById("items");box.innerHTML="";let total=0;if(!c.length)box.innerHTML='<p style="color:#9ca3b8">Your cart is empty.</p>';c.forEach((x,i)=>{total+=x.price;const d=document.createElement("div");d.className="item";d.innerHTML="<div><b>"+x.name+"</b><div style='color:#9ca3b8'>"+x.color+" · "+x.size+"</div></div><div>$"+x.price.toFixed(2)+" <button data-i='"+i+"'>Remove</button></div>";box.appendChild(d)});box.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{c.splice(+b.dataset.i,1);saveCart(c);render()});document.getElementById("total").textContent="$"+total.toFixed(2)}render()</script></body></html>
