<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production history · Midnight Designs</title><link rel="stylesheet" href="/ai-factory.css"></head><body><main><header class="panel"><p class="eyebrow">Private master workspace</p><h1>Production history and recovery</h1><p><a href="/ai-factory">AI Factory</a> · <a href="/ai-employees">Employees</a></p><p id="historyStatus" role="status" aria-live="polite"></p><p id="historyStorage" class="small"></p><button id="historyRefresh">Refresh history</button><label>Filter<select id="historyFilter"><option value="all">All products</option><option value="draft">Drafts</option><option value="approved">Approved</option><option value="published">Published</option><option value="failed">Failed / needs input</option><option value="archived">Archived</option></select></label><label>Search<input id="historySearch" type="search" placeholder="Product name, employee or ID"></label></header><section id="historyProducts" class="employee-grid"></section><button id="historyOlderProducts">Load older products</button><section id="historyDetail" class="panel" hidden></section><section class="panel"><h2>Entire factory activity</h2><p class="small">Master edits and worker changes retain before and after records. Older records have unknown original authors. Supporting employees work within shared worker tasks.</p><div id="historyActivity"></div><button id="historyMore">Load older activity</button></section></main><script src="/factory-history.js" defer></script></body></html>
