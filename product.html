<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Midnight Designs</title><link rel="stylesheet" href="styles.css"><style>.wrap{max-width:1100px;margin:auto;padding:70px 28px;display:grid;grid-template-columns:1fr 1fr;gap:50px}.visual{min-height:520px;border:1px solid var(--line);border-radius:24px;background:radial-gradient(circle at 50% 30%,rgba(139,92,246,.20),transparent 38%),linear-gradient(145deg,#15192b,#090b14);display:flex;align-items:center;justify-content:center;font-size:140px}.info h1{font-size:44px}.info select{width:100%;height:44px;background:#111526;color:#fff;border:1px solid var(--line);border-radius:9px;padding:8px;margin:7px 0 14px}.buy{width:100%}@media(max-width:800px){.wrap{grid-template-columns:1fr}}</style></head><body><header><div class="nav"><a class="brand" href="index.html">MIDNIGHT DESIGNS</a><a class="pill" href="cart.html">Cart <span id="cartCount">0</span></a></div></header><main class="wrap"><div id="visual" class="visual"></div><div class="info"><div id="cat" class="eyebrow"></div><h1 id="name"></h1><div id="price" class="price"></div><p style="color:#9ca3b8;line-height:1.6">A clean Midnight Designs base made for everyday wear and bold after-dark graphics.</p><label>Size</label><select id="size"><option>S</option><option>M</option><option selected>L</option><option>XL</option><option>2XL</option></select><label>Color</label><select id="color"><option>Black</option><option>Midnight Navy</option><option>White</option><option>Heather Gray</option></select><button id="add" class="btn dark buy">Add to Cart</button></div></main><script src="app.js"></script><script>const id=new URLSearchParams(location.search).get("id")||"shirt",p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];document.getElementById("visual").textContent=p.icon;document.getElementById("cat").textContent=p.category;document.getElementById("name").textContent=p.name;document.getElementById("price").textContent="$"+p.price.toFixed(2);document.getElementById("add").onclick=()=>{const c=cart();c.push({id:p.id,name:p.name,price:p.price,size:document.getElementById("size").value,color:document.getElementById("color").value,qty:1});saveCart(c);location.href="cart.html"};updateCartCount()</script></body></html>
